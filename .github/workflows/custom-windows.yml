name: Windows Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 submodule 源码
        run: |
          mv -Force .gitmodules_github .gitmodules
          git submodule sync
          git submodule update --init

      - name: 配置 vcpkg
        uses: lukka/run-vcpkg@v7
        with:
          vcpkgDirectory: '${{github.workspace}}/vcpkg'
          vcpkgTriplet: x64-windows-static
          vcpkgGitCommitId: 'efcfaaf60d7ec57a159fc3110403d939bfb69729'
          vcpkgArguments: 'openssl libsrtp[openssl] usrsctp'

      - name: 编译项目
        uses: lukka/run-cmake@v3
        with:
          useVcpkgToolchainFile: true
          buildDirectory: '${{github.workspace}}/build'
          cmakeAppendedArgs: '-DENABLE_WEBRTC=ON -DENABLE_SRT=ON -DENABLE_OPENSSL=ON -DENABLE_API=ON -DENABLE_SERVER=ON -DENABLE_PLAYER=OFF -DENABLE_TESTS=OFF'
          cmakeBuildType: ${{ github.event.inputs.build_type }}

      - name: 设置环境变量
        run: |
          $dateString = Get-Date -Format "yyyy-MM-dd"
          echo "DATE=$dateString" >> $env:GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MediaKit_${{ github.event.inputs.build_type }}_${{ env.DATE }}
          path: release/*
          if-no-files-found: error
          retention-days: 90
