name: Kylin Server Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      BUILD_TYPE: ${{ inputs.build_type }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 submodule 源码
        run: |
          mv -f .gitmodules_github .gitmodules
          git submodule sync
          git submodule update --init --recursive

      - name: 下载 libsrtp
        uses: actions/checkout@v4
        with:
          repository: cisco/libsrtp
          fetch-depth: 1
          ref: v2.3.0
          path: 3rdpart/libsrtp

      - name: 下载 openssl
        uses: actions/checkout@v4
        with:
          repository: openssl/openssl
          fetch-depth: 1
          ref: OpenSSL_1_1_1w
          path: 3rdpart/openssl

      - name: 下载 usrsctp
        uses: actions/checkout@v4
        with:
          repository: sctplab/usrsctp
          fetch-depth: 1
          ref: 0.9.5.0
          path: 3rdpart/usrsctp

      - name: 在 glibc 2.28 容器中编译并打包
        run: |
          docker pull --platform linux/amd64 rockylinux:8
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/work" -w /work -e BUILD_TYPE \
            rockylinux:8 bash package/build_kylin.sh

      - name: 设置环境变量
        run: echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MediaKit_KylinV10_x86_64_${{ inputs.build_type }}_${{ env.DATE }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 90
